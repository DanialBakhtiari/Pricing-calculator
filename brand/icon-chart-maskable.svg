<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pricing Calculator">
  <defs>
    <linearGradient id="pcMask" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f7bff" />
      <stop offset=".55" stop-color="#7c5cff" />
      <stop offset="1" stop-color="#5a20b3" />
    </linearGradient>
  </defs>
  <!-- full-bleed tile (no rounded corners) for maskable / apple-touch safe zones -->
