<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c5cff" />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ماشین‌حساب قیمت‌گذاری وب، وردپرس و سئو</title>
    <meta
      name="description"
      content="ابزار محاسبه‌ی قیمت قابل‌دفاع پروژه‌های وب، وردپرس و سئو — کلاینت‌ساید، فارسی و آفلاین."
    />
    <script>
      // Set theme before paint to avoid flash of incorrect theme.
      // Reads the persisted zustand appStore blob (key: pricing:app:v1).
      (function () {
        try {
          var raw = localStorage.getItem('pricing:app:v1');
          var stored = raw ? JSON.parse(raw).state.theme : null;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage unavailable or malformed; fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
