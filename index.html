<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c5cff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ماشین‌حساب قیمت‌گذاری وب، وردپرس و سئو</title>
    <meta
      name="description"
      content="ابزار محاسبه‌ی قیمت قابل‌دفاع پروژه‌های وب، وردپرس و سئو — کلاینت‌ساید، فارسی و آفلاین."
    />
    <script>
      // Set theme + language/direction before paint to avoid flashes.
      // Reads the persisted zustand appStore blob (key: pricing:app:v1).
      (function () {
        try {
          var raw = localStorage.getItem('pricing:app:v1');
          var state = raw ? JSON.parse(raw).state : null;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = state && state.theme ? state.theme : 'system';
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          var locale = state && state.locale ? state.locale : 'fa';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'fa' ? 'rtl' : 'ltr';
        } catch (e) {
          /* storage unavailable or malformed; fall back to defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
