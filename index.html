    <script>
      // Set theme + language/direction before paint to avoid flashes.
      // Reads the persisted zustand appStore blob (key: pricing:app:v1).
      (function () {
        try {
          var raw = localStorage.getItem('pricing:app:v1');
          var state = raw ? JSON.parse(raw).state : null;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = state && state.theme ? state.theme === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
          var locale = state && state.locale ? state.locale : 'fa';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'fa' ? 'rtl' : 'ltr';
        } catch (e) {
          /* storage unavailable or malformed; fall back to defaults */
        }
      })();
    </script>
